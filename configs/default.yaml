# =============================================================================
# HELM-BERT Default Configuration (Common settings ONLY)
# =============================================================================
# This file contains ONLY settings shared across ALL tasks.
# Task-specific settings belong in their respective config files.

# =============================================================================
# Paths (common structure)
# =============================================================================
paths:
  output_dir: ./outputs
  checkpoint_dir: ./checkpoints
  results_dir: ./results

# =============================================================================
# Model (common base)
# =============================================================================
model:
  pretrained_path: Flansma/helm-bert
  trust_remote_code: true

# =============================================================================
# Training (common defaults)
# =============================================================================
training:
  seed: 42
  weight_decay: 0.01
  early_stopping_patience: 20
  gradient_clip_val: 1.0

# =============================================================================
# Data (common settings)
# =============================================================================
data:
  num_workers: 8
  pin_memory: true
  max_seq_length: 512

# =============================================================================
# Hardware
# =============================================================================
hardware:
  devices: 1
  precision: 32-true

# =============================================================================
# Trainer (PyTorch Lightning)
# =============================================================================
trainer:
  log_every_n_steps: 10
  deterministic: true
  float32_matmul_precision: high

# =============================================================================
# Display
# =============================================================================
display:
  model_summary_max_depth: 2

# =============================================================================
# Logging
# =============================================================================
logging:
  wandb_project: HELM-BERT
  wandb_entity: null
  disable_wandb: false
  tags: []
