# =============================================================================
# HELM-BERT PPI (Peptide-Protein Interaction) Base Configuration
# =============================================================================
# Shared settings for all PPI experiments.
# Do not use directly — use ppi_random.yaml or ppi_acsm.yaml instead.
#
# Usage:
#   python scripts/train_ppi.py --config configs/ppi_random.yaml
#   python scripts/train_ppi.py --config configs/ppi_acsm.yaml

# =============================================================================
# Paths
# =============================================================================
paths:
  output_dir: ./outputs/ppi
  results_dir: ./results/ppi
  cache_dir: ./data/embeddings

# =============================================================================
# Model
# =============================================================================
model:
  # Drug encoder (HELM-BERT for peptides)
  drug_encoder:
    pretrained_path: Flansma/helm-bert
    freeze: true

  # Target encoder (ESM-2 for proteins)
  target_encoder:
    pretrained_path: facebook/esm2_t33_650M_UR50D
    freeze: true

  # MLP head (Dirichlet: K=2 for binary classification)
  head:
    dropout: 0.1
    num_classes: 2

# =============================================================================
# Training
# =============================================================================
training:
  batch_size: 32
  encoder_lr: 3.0e-5
  head_lr: 1.0e-4
  use_cached_embeddings: true

# =============================================================================
# Data
# =============================================================================
data:
  drug_column: Peptide_HELM
  target_column: Receptor_Sequence
  label_column: Label
  val_ratio: 0.1
  max_drug_length: 512
  max_target_length: 1024

# =============================================================================
# ESM-2 Model Hidden Sizes
# =============================================================================
esm_hidden_sizes:
  facebook/esm2_t6_8M_UR50D: 320
  facebook/esm2_t12_35M_UR50D: 480
  facebook/esm2_t30_150M_UR50D: 640
  facebook/esm2_t33_650M_UR50D: 1280
  facebook/esm2_t36_3B_UR50D: 2560
  facebook/esm2_t48_15B_UR50D: 5120

# =============================================================================
# Hardware
# =============================================================================
hardware:
  devices: [0]

# =============================================================================
# Batch Key Names
# =============================================================================
batch_keys:
  drug_ids: drug_ids
  drug_mask: drug_mask
  target_ids: target_ids
  target_mask: target_mask
  drug_embedding: drug_embedding
  target_embedding: target_embedding
  label: label

# =============================================================================
# Embedding Cache
# =============================================================================
cache:
  drug_encoder_name: helmbert
  target_encoder_name: esm2_650m
  dataset_type: ppi

# =============================================================================
# Classification Settings
# =============================================================================
classification:
  prediction_threshold: 0.5

# =============================================================================
# Evidential Deep Learning (Dirichlet classification)
# =============================================================================
evidence:
  lambda_coeff: 0.15

# =============================================================================
# Checkpoint
# =============================================================================
checkpoint:
  monitor: val_loss
  mode: min
  filename_pattern: "{epoch}-{val_loss:.4f}"
  save_top_k: 10
  save_last: true

