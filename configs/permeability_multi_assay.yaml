# =============================================================================
# HELM-BERT Multi-Assay Permeability Regression Configuration
# =============================================================================
# Two-head NIG evidential regression: PAMPA + Caco2.
# Inherits common settings from default.yaml.
#
# Usage:
#   python scripts/train_permeability_multi_assay.py
#   python scripts/train_permeability_multi_assay.py model.freeze_encoder=true

# =============================================================================
# Paths
# =============================================================================
paths:
  output_dir: ./outputs/permeability_multi_assay
  results_dir: ./results/permeability_multi_assay

# =============================================================================
# Model
# =============================================================================
model:
  freeze_encoder: false
  encoder_attribute_name: helmbert

  # Classifier head (shared across both assay outputs)
  classifier:
    num_layers: 2
    dropout: 0.1

# =============================================================================
# Training
# =============================================================================
training:
  max_epochs: 100
  batch_size: 32
  encoder_lr: 3.0e-5
  head_lr: 1.0e-4

# =============================================================================
# Data
# =============================================================================
data:
  split_name: cycpeptmpdb_multi_assay
  train_file: ./data/downstream/cycpeptmpdb_multi_assay_random_train.csv
  test_file: ./data/downstream/cycpeptmpdb_multi_assay_random_test.csv
  helm_column: HELM
  assay_columns:
    - PAMPA
    - Caco2
  val_ratio: 0.1
  max_seq_length: 512

# =============================================================================
# Hardware
# =============================================================================
hardware:
  devices: [0]

# =============================================================================
# Evidential Deep Learning (Normal-Inverse-Gamma regression)
# =============================================================================
evidence:
  lambda_coeff: 0.01

# =============================================================================
# Checkpoint
# =============================================================================
checkpoint:
  monitor: val_loss
  mode: min
  filename_pattern: "{epoch}-{val_loss:.4f}"
  save_top_k: 10
  save_last: true
