# =============================================================================
# HELM-BERT Evidential Regression Configuration
# =============================================================================
# Inherits common settings from default.yaml.
# Do not use directly — use permeability_random.yaml, sst2_random.yaml, etc.
#
# Usage:
#   python scripts/train_regression.py --config configs/permeability_random.yaml
#   python scripts/train_regression.py --config configs/sst2_random.yaml

# =============================================================================
# Paths (overridden by task-specific configs)
# =============================================================================
paths:
  output_dir: ./outputs/regression
  results_dir: ./results/regression

# =============================================================================
# Model
# =============================================================================
model:
  freeze_encoder: false
  encoder_attribute_name: helmbert

  # Classifier head
  classifier:
    num_layers: 2
    dropout: 0.1

# =============================================================================
# Training
# =============================================================================
training:
  max_epochs: 100
  batch_size: 32
  encoder_lr: 3.0e-5
  head_lr: 1.0e-4

# =============================================================================
# Data (overridden by task-specific configs)
# =============================================================================
data:
  helm_column: HELM
  target_column: Permeability
  val_ratio: 0.1
  max_seq_length: 512

# =============================================================================
# Hardware
# =============================================================================
hardware:
  devices: [0]

# =============================================================================
# Batch Key Names
# =============================================================================
batch_keys:
  input_ids: input_ids
  attention_mask: attention_mask
  target: target

# =============================================================================
# Evidential Deep Learning (Normal-Inverse-Gamma regression)
# =============================================================================
evidence:
  lambda_coeff: 0.01

# =============================================================================
# Checkpoint
# =============================================================================
checkpoint:
  monitor: val_mse
  mode: min
  filename_pattern: "{epoch}-{val_mse:.4f}"
  save_top_k: 10
  save_last: true
